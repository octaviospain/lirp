name: Manual Release to Maven Central

on:
    workflow_dispatch:
        inputs:
            version-increment:
                description: 'Version increment strategy'
                required: true
                default: 'incrementMinor'
                type: choice
                options:
                    - incrementPatch
                    - incrementMinor
                    - incrementMajor

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
                with:
                    fetch-depth: 0

            -   name: Setup Git Credentials
                env:
                    PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
                    REPO: ${{ github.repository }}
                run: |
                    git config --global user.email "github-actions@github.com"
                    git config --global user.name "github-actions"
                    git remote set-url origin "https://x-access-token:$PAT_TOKEN@github.com/$REPO.git"

            -   name: Set up JDK 21
                uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
                with:
                    java-version: 21
                    distribution: 'zulu'
                    java-package: 'jdk+fx'

            -   name: Cache Gradle packages
                uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                    restore-keys: |
                        ${{ runner.os }}-gradle-

            -   name: Build and Test
                run: ./gradlew build -PversionIncrement=${{ inputs.version-increment }}

            -   name: Generate CycloneDX SBOM
                # --no-parallel works around the cyclonedx-gradle-plugin parallel-resolution
                # error: "Resolution of the configuration ':<module>:runtimeClasspath' was attempted
                # without an exclusive lock."
                run: ./gradlew cyclonedxBom --no-parallel -PversionIncrement=${{ inputs.version-increment }}

            -   name: Upload SBOM artifact
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
                with:
                    name: lirp-sbom-cyclonedx
                    path: build/reports/bom.json
                    if-no-files-found: error

            -   name: Release
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
                    ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
                    ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
                    ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
                    ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
                run: |
                    ./gradlew createRelease -PversionIncrement=${{ inputs.version-increment }}
                    git push --tags origin HEAD
                    ./gradlew publishToMavenCentral -PversionIncrement=${{ inputs.version-increment }}
