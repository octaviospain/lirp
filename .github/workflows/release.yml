name: Manual Release to Maven Central

on:
    workflow_dispatch:
        inputs:
            version-increment:
                description: 'Version increment strategy'
                required: true
                default: 'incrementMinor'
                type: choice
                options:
                    - incrementPatch
                    - incrementMinor
                    - incrementMajor

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
                with:
                    fetch-depth: 0

            -   name: Setup Git Credentials
                env:
                    PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
                    REPO: ${{ github.repository }}
                run: |
                    git config --global user.email "github-actions@github.com"
                    git config --global user.name "github-actions"
                    git remote set-url origin "https://x-access-token:$PAT_TOKEN@github.com/$REPO.git"

            -   name: Set up JDK 25
                uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
                with:
                    java-version: 25
                    distribution: 'zulu'
                    java-package: 'jdk+fx'

            -   name: Cache Gradle packages
                uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                    restore-keys: |
                        ${{ runner.os }}-gradle-

            -   name: Build and Test
                run: ./gradlew build -PversionIncrement=${{ inputs.version-increment }}

            -   name: Generate CycloneDX SBOM
                # --no-parallel works around the cyclonedx-gradle-plugin parallel-resolution
                # error: "Resolution of the configuration ':<module>:runtimeClasspath' was attempted
                # without an exclusive lock."
                run: ./gradlew cyclonedxBom --no-parallel -PversionIncrement=${{ inputs.version-increment }}

            -   name: Upload SBOM artifact
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: lirp-sbom-cyclonedx
                    path: build/reports/cyclonedx/bom.json
                    if-no-files-found: error

            -   name: Release
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
                    ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
                    ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
                    ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
                    ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
                run: |
                    ./gradlew createRelease -PversionIncrement=${{ inputs.version-increment }}
                    git push --tags origin HEAD
                    ./gradlew publishToMavenCentral -PversionIncrement=${{ inputs.version-increment }}
