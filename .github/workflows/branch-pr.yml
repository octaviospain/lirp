name: branch / PR build

on:
    push:
        branches-ignore:
            - master
        paths-ignore:
            - "**.md"
            - '.gitignore'
            - 'docs/**'
    pull_request:
        types: [opened, synchronize, reopened]
        branches:
            - master
        paths-ignore:
            - "**.md"
            - '.gitignore'
            - 'docs/**'
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    fetch-depth: 0

            -   name: Dependency Review
                if: github.event_name == 'pull_request'
                uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
                with:
                    fail-on-severity: high
                    comment-summary-in-pr: on-failure

            -   name: Set up JDK 21
                uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
                with:
                    java-version: 21
                    distribution: 'zulu'
                    java-package: 'jdk+fx'

            -   name: Cache Gradle packages
                uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                    restore-keys: |
                        ${{ runner.os }}-gradle-

            -   name: Build with Gradle
                run: ./gradlew build

            -   name: Cross-check verification metadata against Maven Central
                # Re-resolves every dependency with --refresh-dependencies (bypasses the
                # cache restored above) and writes a fresh dependency-verification report
                # to verification-metadata.dryrun.xml. Two outcomes:
                #   1. Gradle's own dependency-verification rejects a freshly-downloaded
                #      artifact whose SHA does not match the committed metadata — fails here.
                #   2. The dry-run output diverges from the committed file (new components,
                #      reordering, missing entries) — flagged by the diff below.
                # Together these prove the committed metadata matches what Maven Central
                # currently serves, defeating a poisoned-local-cache attack at regen time.
                run: |
                    ./gradlew --write-verification-metadata sha256 build cyclonedxBom \
                        --dry-run --no-parallel --refresh-dependencies
                    if ! diff -q gradle/verification-metadata.xml gradle/verification-metadata.dryrun.xml > /dev/null; then
                        echo "::error::verification-metadata.xml diverges from Maven Central. Regenerate locally and recommit."
                        diff gradle/verification-metadata.xml gradle/verification-metadata.dryrun.xml || true
                        exit 1
                    fi
                    rm gradle/verification-metadata.dryrun.xml

            -   name: Upload coverage to Codecov
                uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
                env:
                    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
                with:
                    files: build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml

            -   name: Upload test results to Codecov
                if: ${{ !cancelled() }}
                uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    report_type: test_results
                    files: "**/build/test-results/test/*.xml"