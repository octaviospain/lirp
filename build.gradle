import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile
import org.jlleitschuh.gradle.ktlint.reporter.ReporterType

// Build-tooling dependency overrides for OSV advisories. These reach only the plugin/build
// classpath (dev/CI machines), never the runtime artifact shipped to consumers. Drop a pin once
// the owning plugin's own transitive meets the patched floor (verify with the security-scan skill).
buildscript {
    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.fasterxml.jackson.core' && details.requested.name == 'jackson-core') {
                details.useVersion '2.21.1'
                details.because 'OSV GHSA-72hv-8253-57qq'
            }
            if (details.requested.group == 'org.bouncycastle'
                    && details.requested.name in ['bcpg-jdk18on', 'bcpkix-jdk18on', 'bcprov-jdk18on']) {
                details.useVersion '1.84'
                details.because 'OSV GHSA-cj8j-37rh-8475, GHSA-wg6q-6289-32hp, GHSA-c3fc-8qff-9hwx, GHSA-p93r-85wp-75v3'
            }
            if (details.requested.group == 'org.codehaus.plexus' && details.requested.name == 'plexus-utils') {
                details.useVersion '3.6.1'
                details.because 'OSV GHSA-6fmv-xxpf-w3cw'
            }
        }
    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.3.9' apply false
    id 'com.vanniktech.maven.publish' version '0.36.0'
    id 'jacoco-report-aggregation'
    id 'org.jetbrains.dokka' version '2.2.0'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'org.cyclonedx.bom' version '3.2.4'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.0'
    id 'org.jlleitschuh.gradle.ktlint' version '14.2.0'
    id 'pl.allegro.tech.build.axion-release' version '1.21.2'
    id 'org.sonarqube' version '7.3.1.8318'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':lirp-api')
    implementation project(':lirp-core')
    implementation project(':lirp-sql')
    implementation project(':lirp-fx')
}

kotlin {
    jvmToolchain(21)
}

tasks.named('jar') {
    enabled = false
}

scmVersion {
    tag {
        prefix = ''
        initialVersion { t, p -> '1.0.0' }
    }
    useHighestVersion = true
    ignoreUncommittedChanges = false
    versionIncrementer((project.findProperty('versionIncrement') ?: 'incrementMinor') as String)
}

tasks.withType(PublishToMavenLocal).configureEach {
    onlyIf { project != rootProject }
}

group = 'net.transgressoft'
version = scmVersion.version
description = 'LIRP - Lightweight Reactive Persistence. An asynchronous, non-blocking, reactive persistence library for Java and Kotlin.'

sonar {
    properties {
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.organization', 'transgressoft'
        property 'sonar.projectKey', 'octaviospain_lirp'
        property 'sonar.projectName', 'lirp'
        property 'sonar.projectVersion', version
        property 'sonar.junit.reportPaths', 'build/test-results/test,build/test-results/integrationTest'
        def buildDir = project.layout.buildDirectory.get().asFile.absolutePath
        property 'sonar.coverage.jacoco.xmlReportPaths', "${buildDir}/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml"
    }
}

tasks.named('check') {
    dependsOn tasks.named('testCodeCoverageReport')
}

/**
 * Regenerates the dependency-verification ledger from a clean slate so stale/superseded artifact entries are pruned.
 *
 * Gradle merges `--write-verification-metadata` output into the existing `gradle/verification-metadata.xml` file,
 * so an append-then-prune approach leaves stale entries in place. Emptying only the `<components>` element first
 * (while preserving `<configuration>`, including `verify-metadata` and `trusted-artifacts`) guarantees the
 * resulting ledger contains exactly the currently-resolved set — nothing more, nothing less.
 *
 * Run with: `gradle regenerateVerificationMetadata`
 */
tasks.register('regenerateVerificationMetadata', Exec) {
    group = 'verification'
    description = 'Regenerates the dependency-verification ledger from a clean slate so stale/superseded artifact entries are pruned.'

    doFirst {
        def xmlFile = rootProject.file('gradle/verification-metadata.xml')
        if (!xmlFile.exists()) {
            logger.lifecycle('verification-metadata.xml not found — skipping component clear.')
            return
        }
        def content = xmlFile.text
        // Remove all children of <components> while leaving the element itself, then replace with empty tag.
        // This preserves the <configuration> block (verify-metadata / trusted-artifacts) intact.
        def cleared = content.replaceAll(/(?s)<components>.*?<\/components>/, '<components/>')
        xmlFile.text = cleared
        logger.lifecycle('Cleared <components> in verification-metadata.xml; <configuration> block preserved.')
    }

    commandLine 'gradle', 'clean', 'build', 'cyclonedxBom',
            '--write-verification-metadata', 'sha256',
            '--refresh-dependencies',
            '--no-parallel'
}

allprojects {
    tasks.named('cyclonedxDirectBom').configure {
        includeConfigs = ['runtimeClasspath']
        skipConfigs = ['compileClasspath', 'testCompileClasspath', 'testRuntimeClasspath']
    }

    // The buildscript-classpath pin does not reach ktlint's / dokka's own resolver configurations,
    // so the logback override has to be applied to those configurations directly.
    configurations.matching { it.name == 'ktlint' || it.name.startsWith('dokka') }.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'ch.qos.logback') {
                details.useVersion '1.5.25'
                details.because 'OSV GHSA-25qh-j22f-pwp8, GHSA-6v67-2wr5-gvf4, GHSA-pr98-23f8-jwxv, GHSA-qqpg-mvqg-649v'
            }
            if (details.requested.group == 'com.fasterxml.jackson.core' && details.requested.name == 'jackson-core') {
                details.useVersion '2.18.6'
                details.because 'OSV GHSA-72hv-8253-57qq'
            }
        }
    }
}

// The cyclonedx plugin attaches each project's BOM output to its outgoing `cyclonedxDirectBom`
// configuration lazily, inside the task's realization action. When `build` shares a Gradle
// invocation with `cyclonedxBom`, that outgoing variant is observed during task-graph assembly
// before the direct task is realized, and the later artifact attachment throws "Cannot mutate the
// artifacts of configuration after it was consumed as a variant". Realizing the direct tasks once
// every project is evaluated attaches the artifacts up front, before any variant is observed.
gradle.projectsEvaluated {
    allprojects { p ->
        p.tasks.named('cyclonedxDirectBom').get()
    }
}


subprojects {

    apply plugin: 'com.vanniktech.maven.publish'
    apply plugin: 'jacoco'
    apply plugin: 'kotlin'
    apply plugin: 'org.jetbrains.dokka'
    apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
    apply plugin: 'org.jlleitschuh.gradle.ktlint'
    apply plugin: 'org.sonarqube'

    group = 'net.transgressoft'
    project.version = rootProject.version

    dependencies {
        implementation platform(libs.kotlin.bom)
        api platform(libs.coroutines.bom)
        api libs.coroutines.core
    }

    repositories {
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }

    afterEvaluate {
        def metadataTask = tasks.findByName('generateMetadataFileForMavenPublication')
        if (metadataTask != null) {
            metadataTask.dependsOn tasks.named('dokkaJavadocJar')
        }
    }

    kotlin {
        jvmToolchain(21)
    }

    tasks.withType(KotlinJvmCompile).configureEach {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_21)
            freeCompilerArgs.add('-Xjsr305=strict')
        }
    }

    sonar {
        properties {
            property 'sonar.moduleKey', "${project.name}"
            property 'sonar.sources', 'src/main'
            property 'sonar.test.exclusions', 'src/test/**,src/integrationTest/**, src/testFixtures/**'
        }
    }

    ktlint {
        reporters {
            reporter(ReporterType.HTML)
        }
    }

    test {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
        }
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
    }

    check.dependsOn jacocoTestReport

    mavenPublishing {
        publishToMavenCentral()
        coordinates("${project.group}", "${project.name}", "${project.version}")
        pom {
            name = "${project.name}"
            description = project.description
            url = 'https://github.com/octaviospain/lirp'
            inceptionYear = '2025'

            licenses {
                license {
                    name = 'GNU General Public License v3'
                    url = 'https://www.gnu.org/licenses/gpl-3.0.en.html'
                }
            }

            developers {
                developer {
                    id = 'transgressoft'
                    name = 'Octavio Calleya Garcia'
                    email = 'octavio@transgressoft.net'
                    organization = 'transgressoft'
                    organizationUrl = 'https://transgressoft.net'
                }
            }

            scm {
                connection = 'scm:git:git://github.com/octaviospain/lirp.git'
                developerConnection = 'scm:git:ssh://github.com:octaviospain/lirp.git'
                url = 'https://github.com/octaviospain/lirp/tree/master'
            }
        }
        signAllPublications()
    }
}
