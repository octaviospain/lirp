plugins {
    id 'kotlin'
    id 'com.google.devtools.ksp'
    id 'me.champeau.jmh' version '0.7.3'
}

description = 'LIRP Benchmark - JMH microbenchmarks and comparative analysis (not published)'

ktlint {
    filter {
        exclude { it.file.path.contains("/generated/") }
    }
}

dependencies {
    jmh project(':lirp-core')
    jmh project(':lirp-sql')
    ksp project(path: ':lirp-ksp')
    kspJmh project(path: ':lirp-ksp')
    jmh libs.jmh.core
    jmh libs.jmh.generator.annprocess
    jmh libs.jol.core
    jmh libs.h2
    jmh libs.spring.data.jpa
    jmh libs.hibernate.core
    jmh libs.jakarta.persistence.api
    jmh libs.serialization.json
    jmh platform(libs.exposed.bom)
    jmh libs.bundles.exposed
    jmh libs.hikari
    jmh libs.logback.core
    jmh libs.logback.classic
}

jmh {
    warmupIterations = project.hasProperty('jmh.warmupIterations') ? project.property('jmh.warmupIterations').toInteger() : 5
    iterations = project.hasProperty('jmh.iterations') ? project.property('jmh.iterations').toInteger() : 10
    fork = project.hasProperty('jmh.fork') ? project.property('jmh.fork').toInteger() : 1
    if (project.hasProperty('jmh.includes')) {
        includes = [project.property('jmh.includes')]
    }
    // GC profiler (gc.alloc.rate.norm): gradle :lirp-benchmark:jmh -Pjmh.profilers=gc
    if (project.hasProperty('jmh.profilers')) {
        profilers = project.property('jmh.profilers').split(',').toList()
    }
    // Async-profiler flame graphs (local only): gradle :lirp-benchmark:jmh -Pjmh.asyncProfiler
    if (project.hasProperty('jmh.asyncProfiler')) {
        def asyncProfilerPath = project.findProperty('asyncProfilerPath') ?:
            "${System.getProperty('user.home')}/.local/share/JetBrains/Toolbox/apps/intellij-idea-ultimate/lib/async-profiler/amd64/libasyncProfiler.so"
        if (!profilers) profilers = []
        profilers += 'async'
        jvmArgsAppend = ["-agentpath:${asyncProfilerPath}=start,event=cpu,file=/tmp/lirp-profile.svg,flamegraph"]
    }
    resultFormat = 'JSON'
    resultsFile = project.file('build/reports/jmh/results.json')
    jvmArgs = [
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        // jol cannot read field offsets of JDK record classes (e.g. SecureClassLoader$CodeSourceKey)
        // reachable from an entity graph on this JDK; the magic-field-offset fallback restores sizing.
        '-Djol.magicFieldOffset=true'
    ]
}

// Post-process JMH results.json into CSV files and a rendered Performance-Benchmarks.md.
// Wired via finalizedBy below so it runs automatically after every successful :jmh execution.
tasks.register('renderBenchmarkReport', Exec) {
    description = 'Render CSV files and Performance-Benchmarks.md from the JMH results.json.'
    group = 'verification'
    workingDir rootProject.projectDir
    def resultsJson = layout.buildDirectory.file('reports/jmh/results.json')
    def template = file('scripts/Performance-Benchmarks.template.md')
    def outMd = layout.buildDirectory.file('reports/jmh/Performance-Benchmarks.md')
    def csvDir = layout.buildDirectory.dir('reports/jmh/csv')
    inputs.file(resultsJson).optional()
    inputs.file(template).optional()
    outputs.file(outMd)
    outputs.dir(csvDir)
    commandLine 'python3',
        file('scripts/render_benchmark_results.py').absolutePath,
        '--results', resultsJson.get().asFile.absolutePath,
        '--template', template.absolutePath,
        '--out', outMd.get().asFile.absolutePath,
        '--csv-dir', csvDir.get().asFile.absolutePath
    onlyIf { resultsJson.get().asFile.exists() }
}

tasks.named('jmh').configure { finalizedBy 'renderBenchmarkReport' }

// Benchmark module is never published to Maven Central
tasks.withType(PublishToMavenRepository).configureEach { enabled = false }
tasks.withType(PublishToMavenLocal).configureEach { enabled = false }

// No API docs for benchmark code
tasks.matching { it.name.startsWith('dokka') }.configureEach { enabled = false }

// Exclude from SonarCloud analysis
sonar { skipProject = true }

// JaCoCo test report not applicable for JMH benchmarks
tasks.matching { it.name == 'jacocoTestReport' }.configureEach { enabled = false }
