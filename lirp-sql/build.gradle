description = 'LIRP SQL - SQL Persistence via JetBrains Exposed'

apply plugin: 'com.google.devtools.ksp'
apply plugin: 'java-test-fixtures'

// Gradle 9 changed `project(':x')` inside `dependencies { ... }` to return a Dependency, not a
// Project, so accessing `.sourceSets` from there raises "unknown property" under 9.5. Use
// `rootProject.project(':lirp-core')` (a real Project lookup) and force evaluation order so
// the source set output is available when this script reads it.
evaluationDependsOn(':lirp-core')

ktlint {
    filter {
        exclude { it.file.path.contains("/generated/") }
    }
}

sourceSets {
    integrationTest {
        kotlin.srcDirs = ['src/integrationTest/kotlin']
        java.srcDirs = ['src/integrationTest/java']
        resources.srcDirs = ['src/integrationTest/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom implementation
    integrationTestRuntimeOnly.extendsFrom runtimeOnly
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def osArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def isArm64 = osArch.contains('aarch64') || osArch.contains('arm64')
def fxPlatform = osName.contains('mac') ? (isArm64 ? 'mac-aarch64' : 'mac') : osName.contains('win') ? 'win' : 'linux'

dependencies {
    // OSV advisories on transitives of kotest-extensions-testcontainers (test/CI only, never shipped).
    constraints {
        integrationTestImplementation('org.apache.kafka:kafka-clients:4.3.1') {
            because 'OSV GHSA-5qcv-4rpc-jp93, GHSA-wf66-mphr-4c4r'
        }
        integrationTestImplementation('org.lz4:lz4-java:1.8.1') {
            because 'OSV GHSA-cmp6-m4wj-q63q, GHSA-vqf4-7m7x-wgfc'
        }
    }

    api project(path: ':lirp-api')
    api project(path: ':lirp-sql-api')
    api project(path: ':lirp-core')

    ksp project(path: ':lirp-ksp')
    kspTest project(path: ':lirp-ksp')
    kspTestFixtures project(path: ':lirp-ksp')
    kspIntegrationTest project(path: ':lirp-ksp')

    api platform(libs.exposed.bom)
    api libs.exposed.core
    api libs.exposed.kotlin.datetime
    api libs.serialization.json
    implementation libs.exposed.jdbc
    implementation libs.hikari
    implementation libs.kotlin.logging
    runtimeOnly libs.postgresql
    runtimeOnly libs.mysql
    runtimeOnly libs.mariadb
    runtimeOnly libs.sqlite

    testImplementation platform(libs.junit.bom)
    testImplementation libs.bundles.kotest
    testImplementation libs.coroutines.test
    testImplementation libs.h2
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher

    integrationTestImplementation platform(libs.junit.bom)
    integrationTestImplementation libs.bundles.kotest
    integrationTestImplementation libs.kotest.extensions.testcontainers
    integrationTestImplementation libs.testcontainers.postgresql
    integrationTestImplementation libs.testcontainers.mysql
    integrationTestImplementation libs.testcontainers.mariadb
    integrationTestImplementation libs.sqlite
    integrationTestImplementation libs.h2
    integrationTestImplementation libs.coroutines.test
    integrationTestImplementation libs.junit.jupiter
    integrationTestRuntimeOnly libs.junit.platform.launcher
    integrationTestRuntimeOnly libs.postgresql
    integrationTestRuntimeOnly libs.mysql
    integrationTestRuntimeOnly libs.mariadb

    testImplementation project(':lirp-fx')
    testImplementation testFixtures(project(':lirp-fx'))

    // JavaFX for fx delegate SQL persistence tests
    testImplementation "org.openjfx:javafx-base:21:${fxPlatform}"
    testImplementation "org.openjfx:javafx-graphics:21:${fxPlatform}"
    testImplementation 'org.testfx:openjfx-monocle:21.0.2'

    // testFixtures infrastructure — shared entities, table defs, container support
    testFixturesImplementation project(path: ':lirp-api')
    testFixturesImplementation project(path: ':lirp-core')
    testFixturesImplementation testFixtures(project(':lirp-core'))
    testImplementation testFixtures(project(':lirp-core'))
    integrationTestImplementation testFixtures(project(':lirp-core'))
    testFixturesImplementation platform(libs.exposed.bom)
    testFixturesImplementation libs.bundles.exposed
    testFixturesImplementation libs.hikari
    testFixturesImplementation libs.testcontainers.postgresql
    testFixturesImplementation libs.testcontainers.mysql
    testFixturesImplementation libs.testcontainers.mariadb
    testFixturesImplementation libs.sqlite
    testFixturesImplementation libs.kotest.runner.junit6
    // Assertions + nondeterministic (eventually) for the shared persistence-polling helpers
    testFixturesImplementation libs.bundles.kotest

    // Consume testFixtures from both test and integrationTest
    testImplementation testFixtures(project(':lirp-sql'))
    integrationTestImplementation testFixtures(project(':lirp-sql'))
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
}

// JavaFX module system args for fx delegate SQL tests (headless Monocle).
// Uses doFirst to defer configuration resolution to execution time.
tasks.named('test').configure {
    doFirst {
        def fxJars = configurations.testRuntimeClasspath.files
                .findAll { it.name.contains('javafx') }
                .collect { it.absolutePath }
        def monocleJar = configurations.testRuntimeClasspath.files
                .find { it.name.contains('monocle') }
        if (monocleJar == null) {
            throw new GradleException("Monocle JAR not found in testRuntimeClasspath")
        }
        if (fxJars.isEmpty()) {
            throw new GradleException("JavaFX JARs not found in testRuntimeClasspath")
        }
        def fxModulePath = fxJars.join(File.pathSeparator)
        jvmArgs "--module-path=${fxModulePath}",
                '--add-modules=javafx.graphics',
                "--patch-module=javafx.graphics=${monocleJar.absolutePath}",
                '--add-reads=javafx.graphics=ALL-UNNAMED',
                '--add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED',
                '--add-opens=javafx.graphics/com.sun.glass.ui.monocle=ALL-UNNAMED',
                '--add-opens=javafx.graphics/com.sun.javafx.tk=ALL-UNNAMED',
                '--add-opens=javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED',
                '--add-exports=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED',
                '--add-exports=javafx.graphics/com.sun.javafx.util=ALL-UNNAMED',
                '--add-exports=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED',
                '--add-exports=javafx.graphics/com.sun.glass.ui.monocle=ALL-UNNAMED'
    }
}

check.dependsOn integrationTest

jacocoTestReport {
    dependsOn test, integrationTest
    // Use fileTree so missing JaCoCo .exec files are skipped gracefully.
    // Note: `jacocoTestReport` still depends on both `test` and `integrationTest` (line 148).
    executionData fileTree(layout.buildDirectory.get().asFile).include('jacoco/*.exec')
}
