[versions]
kotlin = "2.4.0"
ksp = "2.3.9"
bcv = "0.18.1"
coroutines = "1.11.0"
serialization = "1.11.0"
kotest = "6.2.2"
exposed = "1.3.1"
hikari = "7.1.0"
testcontainers = "2.0.5"
kctfork = "0.13.0"
postgresql = "42.7.13"
mysql = "9.7.0"
mariadb = "3.5.9"
sqlite = "3.53.2.0"
jmh = "1.37"
jol = "0.17"
springDataJpa = "4.1.0"
hibernate = "7.4.4.Final"
jakartaPersistence = "3.2.0"
ch-qos-logback = "1.5.38"
kafka-clients = "4.3.1"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "coroutines" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
coroutines-slf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.18" }

ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

kotest-runner-junit6 = { module = "io.kotest:kotest-runner-junit6", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-assertions-json = { module = "io.kotest:kotest-assertions-json", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-extensions-testcontainers = { module = "io.kotest:kotest-extensions-testcontainers", version.ref = "kotest" }

exposed-bom = { module = "org.jetbrains.exposed:exposed-bom", version.ref = "exposed" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime" }

hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers" }

kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka-clients" }

kctfork-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }

h2 = "com.h2database:h2:2.4.240"
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
mockk = "io.mockk:mockk:1.14.11"
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "ch-qos-logback" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "ch-qos-logback" }
jsr305 = "com.google.code.findbugs:jsr305:3.0.2"
kotlin-logging = "io.github.oshai:kotlin-logging-jvm:8.0.4"

junit-bom = "org.junit:junit-bom:6.1.1"
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
jol-core = { module = "org.openjdk.jol:jol-core", version.ref = "jol" }
spring-data-jpa = { module = "org.springframework.data:spring-data-jpa", version.ref = "springDataJpa" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate" }
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakartaPersistence" }

[bundles]
kotest = [
    "kotest-assertions-core",
    "kotest-assertions-json",
    "kotest-property",
    "kotest-runner-junit6",
]
exposed = [
    "exposed-core",
    "exposed-jdbc",
    "exposed-kotlin-datetime",
]
logback = [
    "logback-classic",
    "logback-core",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
bcv = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
